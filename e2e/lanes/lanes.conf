# Lane assignment for regress-lanes.sh: one line per suite, "suite seconds [lane]".
#   seconds  the suite's serial time, every variant of it, reset included (from a serial run;
#            regress-lanes.sh writes fresh figures to e2e/.out/logs/times.tsv). Free lanes take
#            the unpinned suites longest first, so the long ones don't end up last. A suite missing here
#            (a new one) counts as 600 s, so it starts early.
#   lane     optional: always run this suite on that lane (0 .. LANES-1), before the lane takes others.
#   solo SUITE…  these suites run alone after the lanes, on lane 0 with the other lanes idle (#245):
#                timing-sensitive ones, whose timers trip under three lanes' load.
# A suite's variants always run together, in regress.sh's order, on one lane: prompts and gm write the
# same screenshot names in each of their variants.
