name: sending-stone-local

x-db-config: &db-config
  POSTGRES_DB: sending_stone_db
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: password

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      <<: *db-config
    volumes:
      # Postgres 18+ images keep data in /var/lib/postgresql/<major>/docker,
      # so mount the parent directory rather than /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes $ so it reaches the container;
      # CMD-SHELL lets the container's shell expand them.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
